name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest -q --maxfail=1 --disable-warnings \
                 --cov=calc --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      # -------- Notificações Discord --------
      - name: Notify Discord on success
        if: success()
        run: |
          msg="✅ CI passou no repo ${GITHUB_REPOSITORY} (branch: ${GITHUB_REF_NAME}) — workflow: ${GITHUB_WORKFLOW}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"content":"%s"}' "$msg")
          code=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Content-Type: application/json" \
                   -d "$payload" \
                   "${{ secrets.DISCORD_WEBHOOK3 }}")
          echo "Discord HTTP status: $code"
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Notify Discord on failure
        if: failure()
        run: |
          msg="❌ CI falhou no repo ${GITHUB_REPOSITORY} (branch: ${GITHUB_REF_NAME}) — workflow: ${GITHUB_WORKFLOW}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"content":"%s"}' "$msg")
          code=$(curl -s -o /dev/null -w "%{http_code}" \
                   -H "Content-Type: application/json" \
                   -d "$payload" \
                   "${{ secrets.DISCORD_WEBHOOK3 }}")
          echo "Discord HTTP status: $code"
          test "$code" -ge 200 -a "$code" -lt 300
